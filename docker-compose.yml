version: '3.8'
services:
  drone_sim:
    build: .
    image: aerial_manipulation_sim:latest
    container_name: px4_gazebo_container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
